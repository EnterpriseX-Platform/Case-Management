# Local / evaluation stack, one container per service. Each scales on its own:
#   docker compose up -d --scale engine=3 --scale integration=2
# The scheduler runs as two replicas: one is active, the other stands by.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cm
      POSTGRES_USER: cm
      POSTGRES_PASSWORD: cm-local-only
    ports: ["55432:5432"]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cm -d cm"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    environment: &cm-env
      DATABASE_URL: postgres://cm:cm-local-only@db:5432/cm?sslmode=disable
      CALLBACK_SECRET: change-me-local-only
      PUBLIC_URL: http://localhost:8080
      SEED_PACK: /packs/purchase-request.cmpack
      MODE: api
    volumes: ["./packs:/packs:ro"]
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }

  engine:
    build: ./backend
    restart: unless-stopped
    environment: { <<: *cm-env, MODE: engine, SEED_PACK: "" }
    depends_on:
      db: { condition: service_healthy }

  integration:
    build: ./backend
    restart: unless-stopped
    environment: { <<: *cm-env, MODE: integration, SEED_PACK: "" }
    depends_on:
      db: { condition: service_healthy }

  scheduler:
    build: ./backend
    restart: unless-stopped
    environment: { <<: *cm-env, MODE: scheduler, SEED_PACK: "" }
    deploy: { replicas: 2 }
    depends_on:
      db: { condition: service_healthy }

  notify:
    build: ./backend
    restart: unless-stopped
    environment: { <<: *cm-env, MODE: notify, SEED_PACK: "" }
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8080
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  db: {}
